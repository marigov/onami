<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Onami</title>
    <meta name="description" content="Onami is a focused radio player for discovering stations, saving favorites, and listening without clutter.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page">
        <section class="hero">
            <div class="hero-copy">
                <div class="app-lockup">
                    <img class="app-icon" src="images/icon_light.png" alt="Onami app icon">
                    <h1 class="app-title">
                        <span class="app-name">Onami</span>
                        <span class="app-tagline">Radio, <span class="app-tagline-muted">without the clutter</span></span>
                    </h1>
                </div>

                <p class="intro">
                    Discover stations from around the world, keep your favorite ones close, and jump into playback instantly.
                </p>

                <p class="plus-copy">
                    <span class="plus-emphasis">Onami Plus</span> unlocks song detection, removes ads, and expands favorites for
                    listeners who want the full app.
                </p>

                <a
                    class="app-store-badge"
                    href="https://apps.apple.com/us/app/onami/id6760269737?itscg=30200&amp;itsct=apps_box_badge&amp;mttnsubad=6760269737"
                    target="_blank"
                    rel="noreferrer"
                    aria-label="Download Onami on the App Store"
                >
                    <img
                        class="app-store-badge-image"
                        src="https://toolbox.marketingtools.apple.com/api/v2/badges/download-on-the-app-store/black/en-us?releaseDate=1774742400"
                        alt="Download on the App Store"
                    >
                </a>
            </div>

            <div class="hero-media" aria-hidden="true">
                <div class="shot-stage">
                    <img class="shot" src="images/screen_discover.png" alt="">
                    <img class="shot is-active" src="images/screen_favorites.png" alt="">
                    <img class="shot" src="images/screen_playing.png" alt="">
                </div>
            </div>
        </section>

        <footer class="footer">
            <div class="footer-inner">
                <p class="footer-copy">© 2026 Onami. All rights reserved.</p>
                <nav class="footer-links" aria-label="Footer">
                    <a class="footer-link" href="mailto:miketwo+onami@me.com">Support</a>
                </nav>
            </div>
        </footer>
    </main>

    <script>
        (function () {
            var shots = Array.prototype.slice.call(document.querySelectorAll(".shot-stage .shot"));
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || shots.length < 2) {
                return;
            }

            var index = 0;
            window.setInterval(function () {
                shots[index].classList.remove("is-active");
                index = (index + 1) % shots.length;
                shots[index].classList.add("is-active");
            }, 4200);
        }());
    </script>
</body>
</html>
